<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<title>Your cart | Kettle &amp; Kiln</title>
</head>
<body data-page="cart">
<header id="navbar"></header>
<main class="section">
  <div class="container">
    <h1 class="mb-4">Your cart</h1>
    <div class="row g-5">
      <div class="col-lg-8">
        <div id="cartItems"></div>
        <button id="clearCart" class="btn btn-link text-secondary px-0 mt-3">Empty cart</button>
      </div>
      <div class="col-lg-4">
        <aside id="cartSummary" class="summary d-none">
          <h2 class="h5 mb-3">Order summary</h2>
          <div class="d-flex justify-content-between mb-2"><span>Subtotal</span><span id="sumSubtotal"></span></div>
          <div class="d-flex justify-content-between mb-2"><span>Shipping</span><span id="sumShipping"></span></div>
          <p class="small text-secondary" id="freeNote"></p>
          <hr>
          <div class="d-flex justify-content-between fs-5 fw-semibold mb-3"><span>Total</span><span id="sumTotal"></span></div>
          <a href="checkout.html" class="btn btn-leaf w-100 py-2">Go to checkout</a>
          <a href="index.html#shop" class="btn btn-link w-100 mt-2">Keep shopping</a>
        </aside>
      </div>
    </div>
  </div>
</main>
<footer class="site-footer"><div class="container d-flex flex-wrap justify-content-between gap-2"><span>© Kettle &amp; Kiln. Demo store, no real payments.</span><span class="text-secondary">Loose-leaf tea and teaware</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
