<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<title>Sign up | Kettle &amp; Kiln</title>
</head>
<body data-page="signup">
<header id="navbar"></header>
<main class="auth-wrap">
  <div class="container d-flex justify-content-center">
    <div class="auth-card">
      <h1 class="h3 mb-1">Create your account</h1>
      <p class="text-secondary mb-4">Save your cart and check out faster.</p>
      <div id="formError" class="alert alert-danger d-none" role="alert"></div>
      <form id="signupForm" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label">Full name</label>
          <input type="text" class="form-control" id="name" name="name" autocomplete="name" minlength="2" required>
          <div class="invalid-feedback">Enter your name.</div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="6" required>
          <div class="invalid-feedback">Use at least 6 characters.</div>
        </div>
        <div class="mb-4">
          <label for="confirm" class="form-label">Confirm password</label>
          <input type="password" class="form-control" id="confirm" name="confirm" autocomplete="new-password" required>
          <div class="invalid-feedback">Passwords do not match.</div>
        </div>
        <button type="submit" class="btn btn-leaf w-100 py-2">Create account</button>
      </form>
      <p class="text-center mt-4 mb-0">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
