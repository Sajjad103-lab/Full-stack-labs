<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Calculator</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            background-color: #f0f2f5;
        }

        .calculator {
            width: 350px;
            background-color: #222;
            border-radius: 20px;
            padding: 20px;
        }

        .display {
            height: 80px;
            background-color: #333;
            color: white;
            border-radius: 12px;
            font-size: 36px;
            text-align: right;
            padding: 15px;
            margin-bottom: 15px;
        }

        .calculator button {
            height: 60px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50%;
        }

        .calculator .operator {
            background-color: #ff9500;
            color: white;
            border: none;
        }

        .calculator .clear {
            background-color: #d4d4d2;
            color: black;
            border: none;
        }

        .calculator .equals {
            background-color: #ff9500;
            color: white;
            border: none;
        }

        .number-btn {
            background-color: #505050;
            color: white;
            border: none;
        }

        .number-btn:hover {
            background-color: #666;
            color: white;
        }

        @media (max-width: 400px) {
            .calculator {
                width: 95%;
            }
        }

    </style>
</head>

<body>

    <!-- Calculator Container -->

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <div class="calculator shadow-lg">

            <!-- Display -->

            <div class="display">
                0
            </div>


            <!-- Buttons -->

            <div class="row g-2">

                <!-- Row 1 -->

                <div class="col-3">
                    <button class="btn clear w-100">
                        C
                    </button>
                </div>

                <div class="col-3">
                    <button class="btn number-btn w-100">
                        ±
                    </button>
                </div>

                <div class="col-3">
                    <button class="btn number-btn w-100">
                        %
                    </button>
                </div>

                <div class="col-3">
                    <button class="btn operator w-100">
                        ÷
                    </button>
                </div>


                <!-- Row 2 -->

                <div class="col-3">
                    <button class="btn number-btn w-100">
                        7
                    </button>
                </div>

                <div class="col-3">
                    <button class="btn number-btn w-100">
                        8
                    </button>
                </div>

                <div class="col-3">
                    <button class="btn number-btn w-100">
                        9
                    </button>
                </div>

                <div class="col-3">
                    <button class="btn operator w-100">
                        ×
                    </button>
                </div>


                <!-- Row 3 -->

                <div class="col-3">
                    <button class="btn number-btn w-100">
                        4
                    </button>
                </div>

                <div class="col-3">
                    <button class="btn number-btn w-100">
                        5
                    </button>
                </div>

                <div class="col-3">
                    <button class="btn number-btn w-100">
                        6
                    </button>
                </div>

                <div class="col-3">
                    <button class="btn operator w-100">
                        −
                    </button>
                </div>


                <!-- Row 4 -->

                <div class="col-3">
                    <button class="btn number-btn w-100">
                        1
                    </button>
                </div>

                <div class="col-3">
                    <button class="btn number-btn w-100">
                        2
                    </button>
                </div>

                <div class="col-3">
                    <button class="btn number-btn w-100">
                        3
                    </button>
                </div>

                <div class="col-3">
                    <button class="btn operator w-100">
                        +
                    </button>
                </div>


                <!-- Row 5 -->

                <div class="col-6">
                    <button class="btn number-btn w-100 rounded-pill">
                        0
                    </button>
                </div>

                <div class="col-3">
                    <button class="btn number-btn w-100">
                        .
                    </button>
                </div>

                <div class="col-3">
                    <button class="btn equals w-100">
                        =
                    </button>
                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
